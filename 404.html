<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0C0B0A">
  <title>404 — Thinkers &amp; Doers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; }
    body {
      background:#0C0B0A;
      color:#F2F0EA;
      font-family:'Archivo',sans-serif;
      overflow:hidden;
    }
    .error-page {
      position:relative;
      width:100vw;
      height:100vh;
      min-height:520px;
      background:url("assets/404-page.png") center center / cover no-repeat;
    }
    .back-home {
      position:absolute;
      top:24px;
      right:32px;
      z-index:10;
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 18px;
      border:1px solid rgba(242,240,234,.28);
      border-radius:999px;
      background:rgba(12,11,10,.72);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      color:#F2F0EA;
      text-decoration:none;
      font-family:'IBM Plex Mono',monospace;
      font-size:12px;
      letter-spacing:.1em;
      text-transform:uppercase;
      transition:opacity 250ms ease,border-color 250ms ease,
                 background 250ms ease,transform 250ms ease;
    }
    .back-home:hover {
      opacity:1;
      border-color:#F2F0EA;
      background:rgba(12,11,10,.9);
      transform:translateY(-1px);
    }
    .back-home:focus-visible {
      outline:2px solid #F2F0EA;
      outline-offset:4px;
    }
    @media (max-width:700px) {
      .error-page { background-position:center center; }
      .back-home {
        top:16px;
        right:16px;
        padding:9px 14px;
        font-size:10px;
      }
    }
  </style>
</head>
<body>
  <main class="error-page" aria-label="Page not found">
    <a class="back-home" href="index.html" aria-label="Return to home page">
      <span aria-hidden="true">←</span>
      <span>Return to home</span>
    </a>
  </main>
</body>
</html>
